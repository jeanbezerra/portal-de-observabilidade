apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-access-service
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: identity-access-service
    app.kubernetes.io/part-of: observabilidade-portal
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-access-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-access-service
        app.kubernetes.io/part-of: observabilidade-portal
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: identity-access-service
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: identity-access-service-config
        - secretRef:
            name: identity-access-service-runtime
        ports:
        - name: http
          containerPort: 8083
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      imagePullSecrets: []
