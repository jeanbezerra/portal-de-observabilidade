apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-access-service-config
  namespace: __NAMESPACE__
data:
  SERVER_ADDRESS: 0.0.0.0
  SESSION_COOKIE_SECURE: 'true'
  SECURITY_PRODUCTION_MODE: 'true'
  CORS_ALLOWED_ORIGINS: https://portal.example.com
  LOGGING_STRUCTURED_FORMAT: ecs
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
  SERVER_PORT: '8083'
  DB_POOL_MIN_IDLE: '1'
  DB_POOL_MAX_SIZE: '5'
