spring.application.name=identity-access-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8083}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_access}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=identity-access-service-pool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_READ_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
spring.session.store-type=redis
spring.session.redis.namespace=obs:identity:session
spring.session.timeout=${SESSION_INACTIVITY_TIMEOUT:30m}
spring.cache.type=redis
spring.cache.cache-names=provider-discovery
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=obs:identity:cache::

server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:OBS_SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.path=/

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis,identityProviderRegistry
management.observations.annotations.enabled=true
management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Identity federation and authorization plane for the OBS Platform
info.app.java=25
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT:ecs}

obs.identity.session.inactivity-timeout=${SESSION_INACTIVITY_TIMEOUT:30m}
obs.identity.session.maximum-lifetime=${SESSION_MAXIMUM_LIFETIME:8h}
obs.identity.session.cookie-name=${SESSION_COOKIE_NAME:OBS_SESSION}
obs.identity.session.secure-cookie=${SESSION_COOKIE_SECURE:true}
obs.identity.session.same-site=${SESSION_COOKIE_SAME_SITE:lax}
obs.identity.token.issuer=${TOKEN_ISSUER:http://localhost:8083}
obs.identity.token.audience=${TOKEN_AUDIENCE:obs-platform}
obs.identity.token.access-token-ttl=${ACCESS_TOKEN_TTL:10m}
obs.identity.token.resource-server-enabled=${RESOURCE_SERVER_ENABLED:false}
obs.identity.token.jwk-set-uri=${JWK_SET_URI:}
obs.identity.security.production-mode=${SECURITY_PRODUCTION_MODE:false}
obs.identity.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:30080}
