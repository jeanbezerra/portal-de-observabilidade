apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-service-config
  namespace: __NAMESPACE__
data:
  QUARTZ_THREAD_COUNT: '5'
  CORS_ALLOWED_ORIGINS: https://portal.example.com
  HTTP_EXECUTOR_ALLOWED_HOSTS: localhost,127.0.0.1
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
  SERVER_ADDRESS: 0.0.0.0
  SERVER_PORT: '8081'
  DB_POOL_MIN_IDLE: '1'
  DB_POOL_MAX_SIZE: '5'
  SPRING_PROFILES_ACTIVE: prod
