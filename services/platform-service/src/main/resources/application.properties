spring.application.name=platform-service

# Local PostgreSQL
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/postgres}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${DB_POOL_MIN_IDLE:2}
spring.r2dbc.pool.min-idle=${DB_POOL_MIN_IDLE:2}
spring.r2dbc.pool.max-size=${DB_POOL_MAX_SIZE:5}

# Swagger/OpenAPI is available at the API root for local development.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Operational endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Servico de experiencia compartilhada do Portal de Observabilidade
