apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-service-config
  namespace: __NAMESPACE__
data:
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
  SERVER_ADDRESS: 0.0.0.0
  SERVER_PORT: '8080'
  DB_POOL_MIN_IDLE: '1'
  DB_POOL_MAX_SIZE: '5'
  CORS_ALLOWED_ORIGINS: https://portal.example.com
