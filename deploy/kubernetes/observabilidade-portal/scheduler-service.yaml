apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
  namespace: observabilidade-portal
  labels:
    app.kubernetes.io/name: scheduler-service
    app.kubernetes.io/part-of: observabilidade-portal
spec:
  selector:
    app.kubernetes.io/name: scheduler-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: observabilidade-portal
  labels:
    app.kubernetes.io/name: scheduler-service
    app.kubernetes.io/part-of: observabilidade-portal
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-service
        app.kubernetes.io/part-of: observabilidade-portal
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler-service
          image: localhost/observabilidade-portal/scheduler-service:local
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_URL
              value: jdbc:postgresql://scheduler-postgres:5432/scheduler
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scheduler-database
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-database
                  key: password
            - name: DB_POOL_MAX_SIZE
              value: "5"
            - name: DB_POOL_MIN_IDLE
              value: "1"
            - name: QUARTZ_THREAD_COUNT
              value: "5"
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:30080
            - name: HTTP_EXECUTOR_ALLOWED_HOSTS
              value: "*"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
