apiVersion: v1
kind: Service
metadata:
  name: portal-web
  namespace: observabilidade-portal
  labels:
    app.kubernetes.io/name: portal-web
    app.kubernetes.io/part-of: observabilidade-portal
spec:
  selector:
    app.kubernetes.io/name: portal-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  namespace: observabilidade-portal
  labels:
    app.kubernetes.io/name: portal-web
    app.kubernetes.io/part-of: observabilidade-portal
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-web
        app.kubernetes.io/part-of: observabilidade-portal
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal-web
          image: localhost/observabilidade-portal/portal-web:local
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 1000
            runAsGroup: 1000
