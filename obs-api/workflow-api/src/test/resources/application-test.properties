spring.datasource.url=jdbc:h2:mem:workflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

kie.flyway.enabled=true
spring.flyway.enabled=false
kogito.persistence.type=jdbc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

kogito.service.url=http://localhost:8082
kogito.jobs-service.url=http://localhost:8082
kogito.data-index.url=http://localhost:8082

logging.level.root=WARN
logging.level.org.springframework=WARN
