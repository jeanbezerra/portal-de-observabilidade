spring.application.name=workflow-api
debug=false

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}

# PostgreSQL local. Em outros ambientes, sobrescreva por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=workflow-api-pool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# O schema do runtime e mantido pelas migrations fornecidas pelo Kogito.
kie.flyway.enabled=true
spring.flyway.enabled=false
kogito.persistence.type=jdbc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Arquitetura compacta: runtime, tarefas, indice, auditoria e jobs na mesma API.
kogito.service.url=${KOGITO_SERVICE_URL:http://localhost:8082}
kogito.jobs-service.url=${KOGITO_JOBS_SERVICE_URL:http://localhost:8082}
kogito.data-index.url=${KOGITO_DATA_INDEX_URL:http://localhost:8082}
spring.graphql.graphiql.enabled=true

# OpenAPI customizado para esta API.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=${spring.application.name}
info.app.description=Engine corporativa de workflows e aprovacoes
info.app.java=21
info.app.kogito=10.2.0
